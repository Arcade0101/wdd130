<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description" content="Get in touch with our team for rafting trip reservations, general inquiries, or website feedback.">
    <meta name="author" content="Mudandi Arcade">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero contact-hero">
            <img src="images/hero.jpg" alt="Rafters on the river">
            <h1>Contact Us</h1>
        </div>

        <section class="company-info">
            <h2>Company Information</h2>
            <div class="info-grid">
                <div class="address-details">
                    <p><strong>Address:</strong> 123 River Run Way, Salmon, ID 83467</p>
                    <p><strong>Phone:</strong> (208) 555-1234</p>
                    <p><strong>Email:</strong> info@whitewaterrafting.com</p>
                </div>
                <div class="map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11634.872714774328!2d-113.9022!3d45.1758!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53a06708605d8f61%3A0x6b840e6c382a514e!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000" 
                        width="100%" 
                        height="300" 
                        loading="lazy" 
                        title="Company Location Map">
                    </iframe>
                </div>
            </div>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Jane Doe, General Manager">
                    <figcaption><strong>Jane Doe</strong> - General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="John Smith, Head River Guide">
                    <figcaption><strong>John Smith</strong> - Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Sarah Connor, Safety Officer">
                    <figcaption><strong>Sarah Connor</strong> - Safety &amp; Operations</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="username">Your Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Your Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" id="purpose-general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Mudandi Arcade</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>
</html>
