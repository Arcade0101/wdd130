<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML and CSS Quiz</title>
  <meta name="description" content="A simple quiz form testing basic knowledge of HTML and CSS.">
  <link rel="stylesheet" href="../styles/quiz.css">
</head>
<body>
  <header>
    <h1>HTML &amp; CSS Knowledge Quiz</h1>
  </header>

  <main>
    <form action="#" method="post">
      
      <!-- Question 1: Text Input -->
      <div class="form-item">
        <label for="q1">1. What does the acronym HTML stand for?</label>
        <input type="text" id="q1" name="q1" required placeholder="Type your answer here...">
      </div>

      <!-- Question 2: Textarea -->
      <div class="form-item">
        <label for="q2">2. Describe the difference between the CSS Box Model content box and border box:</label>
        <textarea id="q2" name="q2" rows="4" placeholder="Explain in 1-2 sentences..."></textarea>
      </div>

      <!-- Question 3: Select Dropdown -->
      <div class="form-item">
        <label for="q3">3. Which CSS property is used to change the background color of an element?</label>
        <select id="q3" name="q3" required>
          <option value="" selected disabled>Choose One ...</option>
          <option value="color">color</option>
          <option value="background-color">background-color</option>
          <option value="bgcolor">bgcolor</option>
          <option value="canvas-color">canvas-color</option>
        </select>
      </div>

      <!-- Question 4: Number Input -->
      <div class="form-item">
        <label for="q4">4. How many main heading levels (h1 through h6) exist in HTML5?</label>
        <input type="number" id="q4" name="q4" min="1" max="10" required>
      </div>

      <!-- Submit Button -->
      <div class="form-item">
        <button type="submit">Submit Quiz</button>
      </div>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 | HTML &amp; CSS Quiz Form</p>
  </footer>
</body>
</html>
